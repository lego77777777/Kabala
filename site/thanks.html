<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabala Pro – תודה!</title>
<style>
  :root { --bg:#fafaf9; --surface:#fff; --border:#e4e4e7; --fg:#18181b; --muted:#64646e; --accent:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d10; --surface:#16161b; --border:#2e2e38; --fg:#ececf1; --muted:#9c9caa; --accent:#7c75ff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:"Segoe UI","Heebo",system-ui,sans-serif; }
  .card { text-align:center; padding:40px 48px; border:1px solid var(--border); border-radius:18px; background:var(--surface); max-width:440px; }
  .icon { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; margin:0 auto 16px; background:#15803d; color:#fff; font-size:28px; }
  p { color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>ברוך הבא ל-Kabala Pro!</h1>
    <p>התשלום התקבל. חזור לאפליקציה ולחץ "רענן סטטוס" במסך המנוי.</p>
    <p dir="ltr">Payment received. Return to Kabala and click "Refresh status" on the Plan screen.</p>
  </div>
</body>
</html>
